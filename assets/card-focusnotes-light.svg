<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img">
  <title>focusnotes project card</title>
  <defs></defs>
  <style>:root{--bg:#FAFAF7;--border:#E4E2DA;--text:#1F2328;--muted:#656D76;--faint:#ECEAE3;--accent:#B45309;--teal:#0F766E;--violet:#6D28D9;--red:#B91C1C}.sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.serif{font-family:"Iowan Old Style", "Charter", "Palatino Linotype", Palatino, Georgia, serif}.tracked{letter-spacing:.08em}.text{fill:var(--text)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.red{fill:var(--red)}.panel{fill:var(--bg);stroke:var(--border);stroke-width:1.2}@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.entrance{animation:cardIn .65s cubic-bezier(.2,.8,.2,1) both}@media(prefers-reduced-motion:reduce){.entrance{animation:none!important;opacity:1;transform:none}}.select-box{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:488;animation:drawSelect .7s cubic-bezier(.2,.8,.2,1) .4s both}@keyframes drawSelect{from{stroke-dashoffset:488}to{stroke-dashoffset:0}}.note-line{animation:noteIn .4s ease-out both}@keyframes noteIn{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){.select-box,.note-line{animation:none!important;opacity:1;stroke-dashoffset:0}}</style>
  <g class="entrance"><rect class="panel" x="0.6" y="0.6" width="598.8" height="298.8" rx="16"/><text class="mono muted" x="32" y="36" font-size="12">02</text><text class="serif text" x="32" y="68" font-size="30" font-weight="600">focusnotes</text><rect x="471.4" y="20" width="96.6" height="24" rx="12" fill="none" stroke="var(--teal)" stroke-width="1"/><text class="mono teal" x="519.7" y="36" text-anchor="middle" font-size="11">open source</text><text class="sans muted" x="32" y="100" font-size="16">Take notes without breaking focus.</text><text class="sans muted" x="32" y="124" font-size="16">Selected text, screen areas &amp; quick notes → Markdown.</text><rect x="32" y="150" width="168" height="10" rx="5" fill="var(--faint)"/><rect x="32" y="170" width="186" height="10" rx="5" fill="var(--faint)"/><rect x="32" y="190" width="140" height="10" rx="5" fill="var(--faint)"/><rect x="32" y="210" width="176" height="10" rx="5" fill="var(--faint)"/><rect x="32" y="230" width="112" height="10" rx="5" fill="var(--faint)"/><rect class="select-box" x="25" y="163" width="200" height="44" rx="6"/><path d="M 258 189 L 266 195 L 258 201" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect class="panel" x="300.5" y="142.5" width="267" height="104" rx="10"/><text class="mono muted note-line" x="316" y="164" font-size="12" style="animation-delay:.5s">inbox.md</text><text class="mono text note-line" x="316" y="189" font-size="12" style="animation-delay:.9s">- selected quote</text><text class="mono text note-line" x="316" y="210" font-size="12" style="animation-delay:1.3s">- OCR → text</text><text class="mono teal note-line" x="316" y="231" font-size="12" style="animation-delay:1.7s">#reading</text><path d="M 32 258 H 568" stroke="var(--faint)" stroke-width="1"/><text class="mono muted" x="32" y="283" font-size="12">Swift · C#/WPF · on-device OCR</text><text class="mono accent" x="568" y="283" text-anchor="end" font-size="12">focusnotes.pages.dev ↗</text></g>
</svg>
