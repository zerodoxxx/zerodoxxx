<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img">
  <title>flatcart project card</title>
  <defs></defs>
  <style>:root{--bg:#0B0F14;--border:#1F2630;--text:#E6EDF3;--muted:#7D8590;--faint:#1A212B;--accent:#FFB547;--teal:#5EEAD4;--violet:#A78BFA;--red:#F87171}.sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.text{fill:var(--text)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.red{fill:var(--red)}.panel{fill:var(--bg);stroke:var(--border);stroke-width:1.2}@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.entrance{animation:cardIn .65s cubic-bezier(.2,.8,.2,1) both}.bar-fill{animation:fillBar 1.2s cubic-bezier(.2,.8,.2,1) both}@keyframes fillBar{from{width:0px}to{width:var(--to)}}.cheaper{animation:showTag .3s ease-out 1.5s both}@keyframes showTag{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){.entrance,.bar-fill,.cheaper{animation:none!important}}</style>
  <g class="entrance"><rect class="panel" x="0.6" y="0.6" width="598.8" height="298.8" rx="16"/><text class="sans text" x="32" y="52" font-size="28" font-weight="700">flatcart</text><rect x="474" y="28" width="94" height="25" rx="12.5" fill="none" stroke="var(--accent)" stroke-width="1.2"/><path d="M 488 39 V 37 A 4 4 0 0 1 496 37 V 39 M 487 39 H 497 V 47 H 487 Z" fill="none" stroke="var(--accent)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="mono accent" x="531" y="45" text-anchor="middle" font-size="12">private</text><text class="sans muted" x="32" y="88" font-size="17">One grocery order for the whole flat.</text><text class="sans muted" x="32" y="112" font-size="17">Shared list, compare carts, split the bill.</text><text class="mono muted" x="32" y="174" font-size="12">Instamart</text><text class="mono text" x="392" y="174" text-anchor="end" font-size="13">₹1,284</text><rect x="32" y="182" width="360" height="8" rx="4" fill="var(--faint)"/><rect class="bar-fill violet" x="32" y="182" width="360" height="8" rx="4" style="--to:360px"/><text class="mono muted" x="32" y="222" font-size="12">Zepto</text><text class="mono text" x="392" y="222" text-anchor="end" font-size="13">₹1,197</text><rect x="32" y="230" width="360" height="8" rx="4" fill="var(--faint)"/><rect class="bar-fill teal" x="32" y="230" width="336" height="8" rx="4" style="--to:336px;animation-delay:.15s"/><g class="cheaper"><rect x="78" y="209" width="58" height="18" rx="9" fill="none" stroke="var(--teal)" stroke-width="1.2"/><text class="mono teal" x="107" y="222" text-anchor="middle" font-size="11">cheaper</text></g><text class="mono muted" x="420" y="180" font-size="13">÷ 4</text><text class="mono text" x="420" y="214" font-size="24">₹299 each</text><text class="mono muted" x="420" y="236" font-size="12">split</text><text class="mono muted" x="32" y="280" font-size="13">TypeScript · Cloudflare Workers · Durable Objects</text></g>
</svg>
