<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img">
  <title>Quorum project card</title>
  <defs></defs>
  <style>:root{--bg:#FAFAF7;--border:#E4E2DA;--text:#1F2328;--muted:#656D76;--faint:#ECEAE3;--accent:#B45309;--teal:#0F766E;--violet:#6D28D9;--red:#B91C1C}.sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.text{fill:var(--text)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.red{fill:var(--red)}.panel{fill:var(--bg);stroke:var(--border);stroke-width:1.2}@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.entrance{animation:cardIn .65s cubic-bezier(.2,.8,.2,1) both}.bar-fill{fill:var(--violet);animation:converge 1.6s cubic-bezier(.2,.8,.2,1) both}@keyframes converge{from{width:var(--from)}to{width:var(--to)}}.contradiction{opacity:0;animation:showContradiction .3s ease-out 1.72s both}@keyframes showContradiction{from{opacity:0}to{opacity:1}}.gauge-fill{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;stroke-dasharray:263.89;stroke-dashoffset:263.89;animation:gauge .9s cubic-bezier(.2,.8,.2,1) .45s both}@keyframes gauge{to{stroke-dashoffset:34.31}}@media(prefers-reduced-motion:reduce){.entrance,.bar-fill,.contradiction,.gauge-fill{animation:none!important;opacity:1}.bar-fill{width:var(--to)!important}.gauge-fill{stroke-dashoffset:34.31!important}}</style>
  <g class="entrance"><rect class="panel" x="0.6" y="0.6" width="598.8" height="298.8" rx="16"/><text class="sans text" x="32" y="52" font-size="28" font-weight="700">Quorum</text><rect x="474" y="28" width="94" height="25" rx="12.5" fill="none" stroke="var(--accent)" stroke-width="1.2"/><path d="M 488 39 V 37 A 4 4 0 0 1 496 37 V 39 M 487 39 H 497 V 47 H 487 Z" fill="none" stroke="var(--accent)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text class="mono accent" x="531" y="45" text-anchor="middle" font-size="12">private</text><text class="sans muted" x="32" y="88" font-size="17">One prompt, five models, one answer.</text><text class="sans muted" x="32" y="112" font-size="17">A private tool, built just for me and my friends.</text><text class="mono muted" x="32" y="161" font-size="12">m1</text><rect x="64" y="152" width="204" height="8" rx="4" fill="var(--faint)"/><rect class="bar-fill bar0" x="64" y="152" width="22" height="8" rx="4" style="--from:22px;--to:160px;animation-delay:0.00s"/><text class="mono muted" x="32" y="183" font-size="12">m2</text><rect x="64" y="174" width="204" height="8" rx="4" fill="var(--faint)"/><rect class="bar-fill bar1" x="64" y="174" width="188" height="8" rx="4" style="--from:188px;--to:166px;animation-delay:0.07s"/><text class="mono muted" x="32" y="205" font-size="12">m3</text><rect x="64" y="196" width="204" height="8" rx="4" fill="var(--faint)"/><rect class="bar-fill bar2" x="64" y="196" width="54" height="8" rx="4" style="--from:54px;--to:154px;animation-delay:0.14s"/><text class="mono muted" x="32" y="227" font-size="12">m4</text><rect x="64" y="218" width="204" height="8" rx="4" fill="var(--faint)"/><rect class="bar-fill bar3" x="64" y="218" width="206" height="8" rx="4" style="--from:206px;--to:164px;animation-delay:0.21s"/><text class="mono muted" x="32" y="249" font-size="12">m5</text><rect x="64" y="240" width="204" height="8" rx="4" fill="var(--faint)"/><rect class="bar-fill bar4" x="64" y="240" width="78" height="8" rx="4" style="--from:78px;--to:158px;animation-delay:0.28s"/><g class="contradiction"><circle cx="279" cy="222" r="3" fill="var(--red)"/><text class="mono red" x="287" y="226" font-size="11">contradiction</text></g><circle cx="493" cy="205" r="42" fill="none" stroke="var(--faint)" stroke-width="8"/><circle class="gauge-fill" cx="493" cy="205" r="42" transform="rotate(-90 493 205)"/><text class="mono text" x="493" y="213" text-anchor="middle" font-size="26">0.87</text><text class="mono muted" x="493" y="264" text-anchor="middle" font-size="12">unity score</text><text class="mono muted" x="32" y="280" font-size="13">Python · FastAPI · LangGraph</text></g>
</svg>
