<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img">
  <title>GroupBasket project card</title>
  <defs></defs>
  <style>:root{--bg:#FAFAF7;--border:#E4E2DA;--text:#1F2328;--muted:#656D76;--faint:#ECEAE3;--accent:#B45309;--teal:#0F766E;--violet:#6D28D9;--red:#B91C1C}.sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.serif{font-family:"Iowan Old Style", "Charter", "Palatino Linotype", Palatino, Georgia, serif}.tracked{letter-spacing:.08em}.text{fill:var(--text)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.red{fill:var(--red)}.panel{fill:var(--bg);stroke:var(--border);stroke-width:1.2}@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.entrance{animation:cardIn .65s cubic-bezier(.2,.8,.2,1) both}@media(prefers-reduced-motion:reduce){.entrance{animation:none!important;opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}.pop{animation:pop .45s cubic-bezier(.2,.8,.2,1) both}.route{fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:drawRoute .6s cubic-bezier(.2,.8,.2,1) both}@keyframes drawRoute{to{stroke-dashoffset:0}}.r-teal{stroke:var(--teal)}.r-violet{stroke:var(--violet)}.r-accent{stroke:var(--accent)}.bubble{fill:none;stroke:var(--border);stroke-width:1}@media(prefers-reduced-motion:reduce){.pop,.route{animation:none!important;opacity:1;transform:none;stroke-dashoffset:0}}</style>
  <g class="entrance"><rect class="panel" x="0.6" y="0.6" width="598.8" height="298.8" rx="16"/><text class="mono muted" x="32" y="36" font-size="12">01</text><text class="serif text" x="32" y="68" font-size="30" font-weight="600">GroupBasket</text><rect x="464.8" y="20" width="103.2" height="24" rx="12" fill="none" stroke="var(--accent)" stroke-width="1"/><text class="mono accent" x="516.4" y="36" text-anchor="middle" font-size="11">early access</text><text class="sans muted" x="32" y="100" font-size="16">One grocery order for the whole flat.</text><text class="sans muted" x="32" y="124" font-size="16">Asks everyone on WhatsApp, compares carts, splits on Splitwise.</text><path class="route r-teal" pathLength="1" style="animation-delay:1.30s" d="M 205 160 C 239 160 256 195.0 296 195.0"/><circle class="pop" cx="205" cy="160" r="2.5" fill="var(--teal)" style="animation-delay:1.30s"/><path class="route r-violet" pathLength="1" style="animation-delay:1.42s" d="M 244 195 C 278 195 256 195.0 296 195.0"/><circle class="pop" cx="244" cy="195" r="2.5" fill="var(--violet)" style="animation-delay:1.42s"/><path class="route r-accent" pathLength="1" style="animation-delay:1.54s" d="M 192 230 C 226 230 256 195.0 296 195.0"/><circle class="pop" cx="192" cy="230" r="2.5" fill="var(--accent)" style="animation-delay:1.54s"/><g class="pop" style="animation-delay:0.35s"><circle cx="44" cy="160" r="10" fill="none" stroke="var(--teal)" stroke-width="1.2"/><text class="mono teal" x="44" y="164" text-anchor="middle" font-size="11" font-weight="600">R</text><rect class="bubble" x="62.5" y="148.5" width="137" height="24" rx="9"/><text class="sans text" x="73" y="164" font-size="12">atta and coke zero</text></g><g class="pop" style="animation-delay:0.65s"><circle cx="44" cy="195" r="10" fill="none" stroke="var(--violet)" stroke-width="1.2"/><text class="mono violet" x="44" y="199" text-anchor="middle" font-size="11" font-weight="600">A</text><rect class="bubble" x="62.5" y="183.5" width="176" height="24" rx="9"/><text class="sans text" x="73" y="199" font-size="12">ek doodh bhi mangwa lena</text></g><g class="pop" style="animation-delay:0.95s"><circle cx="44" cy="230" r="10" fill="none" stroke="var(--accent)" stroke-width="1.2"/><text class="mono accent" x="44" y="234" text-anchor="middle" font-size="11" font-weight="600">N</text><rect class="bubble" x="62.5" y="218.5" width="124" height="24" rx="9"/><text class="sans text" x="73" y="234" font-size="12">eggs too, shared</text></g><g class="pop" style="animation-delay:1.2s"><rect x="296.5" y="181.5" width="134" height="28" rx="14" fill="var(--bg)" stroke="var(--muted)" stroke-width="1.2"/><text class="mono text" x="363.0" y="199.0" text-anchor="middle" font-size="12">1 cart · 4 items</text></g><path class="route" pathLength="1" style="stroke:var(--border);stroke-width:1.5;animation-delay:2s" d="M 430 195.0 C 442 195.0 434 167 444 167"/><path class="route r-teal" pathLength="1" style="animation-delay:2s" d="M 430 195.0 H 444"/><text class="mono muted pop" x="450" y="171" font-size="12" style="animation-delay:2.2s">Instamart ₹471</text><text class="mono text pop" x="450" y="199" font-size="12" style="animation-delay:2.35s">Zepto ₹438 <tspan class="teal">✓</tspan></text><text class="mono muted pop" x="450" y="231" font-size="11" style="animation-delay:2.5s">split → Splitwise</text><path d="M 32 258 H 568" stroke="var(--faint)" stroke-width="1"/><text class="mono muted" x="32" y="283" font-size="12">TypeScript · Cloudflare Workers</text><text class="mono accent" x="568" y="283" text-anchor="end" font-size="12">groupbasket.in ↗</text></g>
</svg>
