<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img">
  <title>Career impact stats</title>
  <defs></defs>
  <style>:root{--bg:#0B0F14;--border:#1F2630;--text:#E6EDF3;--muted:#7D8590;--faint:#1A212B;--accent:#FFB547;--teal:#5EEAD4;--violet:#A78BFA;--red:#F87171}.sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.text{fill:var(--text)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.red{fill:var(--red)}.panel{fill:var(--bg);stroke:var(--border);stroke-width:1.2}@keyframes tileIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.tile{opacity:0;animation:tileIn .62s cubic-bezier(.2,.8,.2,1) both}.underline{stroke:var(--accent);stroke-width:2;stroke-dasharray:240;stroke-dashoffset:240;animation:draw .48s ease-out both}@keyframes draw{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.tile,.underline{animation:none!important;opacity:1;transform:none;stroke-dashoffset:0}}</style>
  <rect class="panel" x="0.6" y="0.6" width="1198.8" height="148.8" rx="16"/><path d="M 300 20 V 130" stroke="var(--faint)" stroke-width="1"/><path d="M 600 20 V 130" stroke="var(--faint)" stroke-width="1"/><path d="M 900 20 V 130" stroke="var(--faint)" stroke-width="1"/><g class="tile tile0" style="animation-delay:0.00s"><text class="sans accent" x="150" y="53" text-anchor="middle" font-size="38" font-weight="700">70%+</text><path class="underline" d="M 103.0 66 H 197.0" style="animation-delay:0.25s"/><text class="sans text" x="150" y="98" text-anchor="middle" font-size="16">faster ticket resolution</text><text class="mono muted" x="150" y="124" text-anchor="middle" font-size="12">enterprise RAG</text></g><g class="tile tile1" style="animation-delay:0.15s"><text class="sans accent" x="450" y="53" text-anchor="middle" font-size="38" font-weight="700">$100k+</text><path class="underline" d="M 384.0 66 H 516.0" style="animation-delay:0.40s"/><text class="sans text" x="450" y="98" text-anchor="middle" font-size="16">compute saved per year</text><text class="mono muted" x="450" y="124" text-anchor="middle" font-size="12">inference API on k8s</text></g><g class="tile tile2" style="animation-delay:0.30s"><text class="sans accent" x="750" y="53" text-anchor="middle" font-size="38" font-weight="700">$2M+</text><path class="underline" d="M 703.0 66 H 797.0" style="animation-delay:0.55s"/><text class="sans text" x="750" y="98" text-anchor="middle" font-size="16">new European revenue</text><text class="mono muted" x="750" y="124" text-anchor="middle" font-size="12">forecasting libraries</text></g><g class="tile tile3" style="animation-delay:0.45s"><text class="sans accent" x="1050" y="53" text-anchor="middle" font-size="38" font-weight="700">14h → &lt;2h</text><path class="underline" d="M 955.0 66 H 1145.0" style="animation-delay:0.70s"/><text class="sans text" x="1050" y="98" text-anchor="middle" font-size="16">Kafka pipeline runtime</text><text class="mono muted" x="1050" y="124" text-anchor="middle" font-size="12">Goldman Sachs</text></g>
</svg>
