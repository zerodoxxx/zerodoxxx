<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img">
  <title>focusnotes project card</title>
  <defs></defs>
  <style>:root{--bg:#0B0F14;--border:#1F2630;--text:#E6EDF3;--muted:#7D8590;--faint:#1A212B;--accent:#FFB547;--teal:#5EEAD4;--violet:#A78BFA;--red:#F87171}.sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.text{fill:var(--text)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.red{fill:var(--red)}.panel{fill:var(--bg);stroke:var(--border);stroke-width:1.2}@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.entrance{animation:cardIn .65s cubic-bezier(.2,.8,.2,1) both}.select-box{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:488;animation:drawSelect 1.1s cubic-bezier(.2,.8,.2,1) .4s both}@keyframes drawSelect{from{stroke-dashoffset:488}to{stroke-dashoffset:0}}.note-line{animation:noteIn .4s ease-out both}@keyframes noteIn{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){.entrance,.select-box,.note-line{animation:none!important}}</style>
  <g class="entrance"><rect class="panel" x="0.6" y="0.6" width="598.8" height="298.8" rx="16"/><text class="sans text" x="32" y="52" font-size="28" font-weight="700">focusnotes</text><rect x="480" y="28" width="88" height="25" rx="12.5" fill="none" stroke="var(--teal)" stroke-width="1.2"/><text class="mono teal" x="524" y="45" text-anchor="middle" font-size="12">public</text><text class="sans muted" x="32" y="88" font-size="17">Take notes without breaking focus.</text><text class="sans muted" x="32" y="112" font-size="17">Selected text, screen areas &amp; quick notes → Markdown.</text><rect x="32" y="150" width="168" height="10" rx="5" fill="var(--faint)"/><rect x="32" y="170" width="186" height="10" rx="5" fill="var(--faint)"/><rect x="32" y="190" width="140" height="10" rx="5" fill="var(--faint)"/><rect x="32" y="210" width="176" height="10" rx="5" fill="var(--faint)"/><rect x="32" y="230" width="112" height="10" rx="5" fill="var(--faint)"/><rect class="select-box" x="25" y="163" width="200" height="44" rx="6"/><path d="M 258 194 L 266 200 L 258 206" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect class="panel" x="300.5" y="140.5" width="267" height="119" rx="10"/><text class="mono muted note-line" x="316" y="162" font-size="12" style="animation-delay:.5s">inbox.md</text><text class="mono text note-line" x="316" y="190" font-size="12" style="animation-delay:1s">- selected quote</text><text class="mono text note-line" x="316" y="212" font-size="12" style="animation-delay:1.5s">- OCR → text</text><text class="mono teal note-line" x="316" y="234" font-size="12" style="animation-delay:2s">#reading</text><text class="mono muted" x="32" y="280" font-size="13">Swift · C#/WPF · on-device OCR · macOS + Windows</text></g>
</svg>
