rx="4" fill="var(--faint)"/><rect class="bar-fill bar4" x="64" y="237" width="78" height="8" rx="4" style="--from:78px;--to:158px;animation-delay:0.28s"/><g class="contradiction"><circle cx="279" cy="219" r="3" fill="var(--red)"/><text class="mono red" x="287" y="223" font-size="11">contradiction</text></g><circle cx="493" cy="188" r="38" fill="none" stroke="var(--faint)" stroke-width="8"/><circle class="gauge-fill" cx="493" cy="188" r="38" transform="rotate(-90 493 188)"/><text class="mono text" x="493" y="196" text-anchor="middle" font-size="24">0.87</text><text class="mono muted" x="493" y="246" text-anchor="middle" font-size="11">unity score</text><path d="M 32 258 H 568" stroke="var(--faint)" stroke-width="1"/><text class="mono muted" x="32" y="283" font-size="12">Python · FastAPI · LangGraph</text><text class="mono muted" x="568" y="283" text-anchor="end" font-size="12">friends only</text></g>
