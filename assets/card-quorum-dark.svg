<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img">
  <title>Quorum project card</title>
  <defs></defs>
  <style>:root{--bg:#0B0F14;--border:#1F2630;--text:#E6EDF3;--muted:#7D8590;--faint:#1A212B;--accent:#FFB547;--teal:#5EEAD4;--violet:#A78BFA;--red:#F87171}.sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}.serif{font-family:"Iowan Old Style", "Charter", "Palatino Linotype", Palatino, Georgia, serif}.tracked{letter-spacing:.08em}.text{fill:var(--text)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.red{fill:var(--red)}.panel{fill:var(--bg);stroke:var(--border);stroke-width:1.2}@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.entrance{animation:cardIn .65s cubic-bezier(.2,.8,.2,1) both}@media(prefers-reduced-motion:reduce){.entrance{animation:none!important;opacity:1;transform:none}}.bar-fill{fill:var(--violet);animation:converge 1.6s cubic-bezier(.2,.8,.2,1) both}@keyframes converge{from{width:var(--from)}to{width:var(--to)}}.contradiction{opacity:0;animation:showContradiction .3s ease-out 1.72s both}@keyframes showContradiction{from{opacity:0}to{opacity:1}}.gauge-fill{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;stroke-dasharray:238.76;stroke-dashoffset:238.76;animation:gauge .7s cubic-bezier(.2,.8,.2,1) .45s both}@keyframes gauge{to{stroke-dashoffset:31.04}}@media(prefers-reduced-motion:reduce){.bar-fill,.contradiction,.gauge-fill{animation:none!important;opacity:1}.bar-fill{width:var(--to)!important}.gauge-fill{stroke-dashoffset:31.04!important}}</style>
